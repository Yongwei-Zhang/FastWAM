# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: fastwam_policy
  task_name: null
  task_config: demo_randomized
  # 决定：每个 episode 里给策略的文本指令从哪一类候选句子里随机抽。设置 unseen 用来测指令泛化
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  # 评测更快，但保存的帧率会低
  skip_get_obs_within_replan: true

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2
  # Libero 多套件评测见 sim_libero.yaml；RoboTwin 入口当前未读此字段。
  task_suite_names: []

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
