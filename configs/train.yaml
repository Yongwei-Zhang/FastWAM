# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# 在 task.yml 中会被覆盖
batch_size: 2  # 每个训练步、每个进程一次从 DataLoader 取多少条样本（再乘 accelerator 进程数才是全局 batch）
num_workers: 4  # DataLoader 用来并行拉取/预处理数据的子进程数。越小、越省内存，但更慢

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10  # 打印训练损失信息的间隔步骤
save_every: 100
eval_every: 50  # 评估间隔
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
